[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgviewer"
version = "0.4.0"
description = "Fast pygame image viewer inspired by xzgv, with a filename list and single-image preview."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
  { name = "William Martinez Bas", email = "metfar@gmail.com" },
]
keywords = ["image-viewer", "pygame", "xzgv", "linux", "android", "pydroid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
  "pygame>=2.6",
]

[project.scripts]
imgviewer = "imgviewer:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["imgviewer"]
