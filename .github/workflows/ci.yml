name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/imgviewer.py
      - name: Self test
        run: python src/imgviewer.py --self-test
      - name: Install package
        run: python -m pip install .
      - name: Test installed command
        run: |
          imgviewer --version
          imgviewer --self-test
